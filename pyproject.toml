[project]
name = "robot-autonome"
version = "0.1.0"
description = "Système de pilotage du robot du club de robotique de claix pour la participation a Erobot senior."
requires-python = ">=3.13"
authors = [
    { name = "Your Name", email = "you@example.com" }
]

dependencies = [
    "pygame>=2.6.1,<3.0.0",
    "pydantic>=2.13.4,<3.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "pyserial>=3.5,<4.0",
    "numba>=0.65.1,<1.0.0",
    "redis>=7.4.0,<8.0.0",
    "colorama>=0.4.6,<1.0.0",
    "pygments>=2.20.0,<3.0.0",
    "bleak>=3.0.2,<4.0.0",
    "loguru>=0.7.3",
    "smbus2>=0.6.1",
]

[project.scripts]
robot-autonome = "src.main:main"

# Poetry : ne pas installer le projet lui-même
[tool.poetry]
package-mode = false

# uv : projet applicatif
[tool.uv]
package = false

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "mypy>=2.1.0",
    "pycycle>=0.0.8",
    "ruff>=0.15.20",
    "black>=26.5.1",
]

[tool.ruff.lint]
ignore = [
    "F405",
    "E701",
]
