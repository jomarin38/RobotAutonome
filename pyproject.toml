[project]
name = "robot-autonome"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Your Name", email = "you@example.com" }
]

dependencies = [
    "pygame>=2.6.1,<3.0.0",
    "pydantic>=2.13.4,<3.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "pyserial>=3.5,<4.0",
    "numba>=0.65.1,<1.0.0",
    "redis>=7.4.0,<8.0.0",
    "colorama>=0.4.6,<1.0.0",
    "pygments>=2.20.0,<3.0.0",
    "bleak>=3.0.2,<4.0.0"
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

# Poetry : ne pas installer le projet lui-même
[tool.poetry]
package-mode = false

# uv : projet applicatif, pas destiné à être build/publish
[tool.uv]
package = false